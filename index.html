<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini PokédexWeb</title>
    <!--Ponemos el framework que usaremos-->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importamos la fuente Pokemon Solid -->
    <link href="https://fonts.cdnfonts.com/css/pokemon-solid" rel="stylesheet"> 
</head>
<body class="bg-gray-300">
    <!-- Header Section -->
    <header class="bg-red-500 p-4 flex items-center gap-2 shadow-lg">
         <h1 class="text-3xl tracking-wide text-yellow-400" style="font-family: 'Pokemon Solid', sans-serif;">PokédexWeb</h1>
    </header>

    <!-- Descripción -->
<section class="max-w-xl mx-auto mt-6 text-center">
    <p class="text-lg text-gray-700 mb-4 font-bold">
        ¡Bienvenido a tu Pokédex! Busca información de cualquier Pokémon usando el nombre o el número. 
    </p>
</section>

    <!-- Barra de búsqueda -->
     <div class="flex justify-center">
        <input 
        type="text number"
        class="w-2/3 p-2 rounded-l border border-gray-400 focus:outline-none focus:ring-2 focus:ring-100"
        id="searchInput">
        <button class="bg-white-400 text-white p-2 rounded-r hover:bg-yellow-500 transition duration-300" id="searchButton"
        id="searchButton">
            Buscar
        </button>
     </div>

</body>
</html>
